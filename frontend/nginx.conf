# nginx sirve la web y reenvía /api a la API por la red interna de Docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver interno de Docker: nginx arranca aunque la API aún no esté lista
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
