name: mensajeria-urbana

services:
  postgres:
    image: postgres:16-alpine
    container_name: mu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_datos:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [red_interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mu-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: mensajeria
    volumes:
      - mongo_datos:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    networks: [red_interna]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mu-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [red_interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: mu-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: mensajeria
      REDIS_URL: redis://redis:6379/0
      TOKEN_SECRET: ${TOKEN_SECRET}
      UBICACION_TTL_SEG: ${UBICACION_TTL_SEG}
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    networks: [red_interna]
    restart: unless-stopped

  sincronizador:
    build: ./backend
    container_name: mu-sincronizador
    command: ["python", "-m", "app.sincronizador"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: mensajeria
      SYNC_INTERVALO_SEG: ${SYNC_INTERVALO_SEG}
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
    networks: [red_interna]
    restart: unless-stopped

networks:
  red_interna:

volumes:
  pg_datos:
  mongo_datos: